---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: gatus-allow
  labels:
    home-0ps.com/policy-target: application
    app: gatus
spec:
  description: |
    Allow rules for the Gatus status engine.
    Ingress: Cilium Gateway (reserved:ingress) + kubelet probes (host/
    remote-node) + Prometheus scrape (monitoring ns) on :8080.
    Egress: DNS + HTTPS to world — Gatus probes services via their
    *.home-0ps.com hostnames (resolved through the CoreDNS split-horizon
    forward to UniFi, which returns the Cilium Gateway LB IP) and
    off-cluster targets (TrueNAS 192.168.20.106, UniFi 10.3.3.1). All
    probe targets are reached over :443.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: gatus
      app: gatus
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # cloudflared tunnel connector → gatus. The public hostname
    # dev-status.home-0ps.com is proxied from cloudflared directly to the
    # gatus pod (not via the Cilium Gateway / reserved:ingress identity),
    # so this allow is required for the public path to work.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflared
            app: cloudflared
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # DNS against kube-dns — covers in-cluster names + CoreDNS split-horizon
    # forwarding *.home-0ps.com queries out to UniFi.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # External HTTPS probes — TrueNAS (192.168.20.106), UniFi (10.3.3.1).
    # Both are unmanaged LAN IPs, so they fall under `world`.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # In-cluster HTTPS probes via the Cilium Gateway. The Gateway LB IP
    # DNATs (via eBPF kube-proxy-replacement) to cilium-envoy pods, and
    # Cilium evaluates egress policy POST-DNAT against the backend pod
    # identity — *not* `world`. Without this rule, gatus probes to
    # https://*.home-0ps.com fail with success=false, errors=0, duration
    # ~8ms (silent drop at policy time).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            k8s-app: cilium-envoy
