site_name: home-0ps
site_description: GitOps Kubernetes home lab — apps, infrastructure, decisions, and roadmap.
site_author: fr3d
docs_dir: _docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Renders ```mermaid blocks as diagrams. Material auto-bundles
        # mermaid.js when this fence is configured — no extra_javascript needed.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - macros:
      module_name: main
      # Opt-in only: pages must set `render_macros: true` in front matter.
      # Keeps Jinja away from archived docs that contain literal {{ }} / {% %}.
      render_by_default: false
      on_error_fail: true

extra_javascript:
  - assets/js/status.js

# Keep the local throwaway scaffold out of the build.
exclude_docs: |
  site-mkdocs/

# Built but intentionally not in the top nav (reachable by direct link).
not_in_nav: |
  /archive/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn

# Reference-first taxonomy (wiki, not narrative). The Architecture section and
# the expanded Network pages (topology, addressing, ingress, service catalog,
# policy matrix) are added in sprints D2–D3 as their pages are created — nav
# entries are only added once the target file exists (mkdocs --strict fails on
# missing nav targets).
nav:
  - Home: README.md
  - Network:
      - Networking: infra/networking.md
      - DNS: infra/dns.md
  - Infrastructure:
      - Storage: infra/storage.md
      - Observability: infra/observability.md
      - Secrets & PKI: infra/secrets-pki.md
  - Applications:
      - Authentik (SSO): apps/authentik.md
      - FreshRSS: apps/freshrss.md
      - Homer: apps/homer.md
  - Decisions:
      - "ADR-0001 · SSO with Authentik": decisions/0001-sso-authentik.md
      - "ADR-0002 · Object storage (R2)": decisions/0002-object-storage-r2.md
      - "ADR-0003 · CNPG local snapshots": decisions/0003-cnpg-local-snapshots.md
      - "ADR-0004 · GPU VFIO passthrough": decisions/0004-gpu-vfio-passthrough.md
      - "ADR-0005 · Thoth knowledge app": decisions/0005-thoth-knowledge-app.md
      - "ADR-0006 · Talos PVE module refactor": decisions/0006-talos-pve-module-refactor.md
      - "ADR-0007 · Service status engine (Gatus)": decisions/0007-service-status-engine.md
  - Operations:
      - Best Practices: guides/best-practices.md
      - Status: status.md
      - Roadmap: roadmap.md
      - Sprints:
          - "Talos PVE module": talos-pve-module-sprints.md
          - "docs-site wiki revamp": docs-site-wiki-revamp-sprint.md
          - "Service status (Gatus)": service-status-sprint.md
      - Reviews:
          - "2026-05-25": reviews/home-0ps-review-2026-05-25.md
          - "2026-05-22": reviews/home-0ps-review-2026-05-22.md
          - "2026-05-20": reviews/home-0ps-review-2026-05-20.md
          - "2026-05-11": reviews/home-0ps-review-2026-05-11.md
          - "2026-04-27": reviews/home-0ps-review-2026-04-27.md
