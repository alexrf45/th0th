site_name: th0th.dev
site_description: Build-your-own GitOps Kubernetes home lab — Talos, Flux, Cilium, CNPG, External Secrets.
site_author: alexrf45
copyright: Built with MkDocs Material · diagrams as code with D2

docs_dir: _docs

# Publish only the build-your-own-lab guide. Internal working notes
# (reviews, sprint trackers, ADRs, archive) and diagram sources stay out.
exclude_docs: |
  reviews/
  archive/
  decisions/
  *-sprint*.md
  diagrams/src/
  diagrams/render.sh
  diagrams/README.md

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/gruvbox.css

repo_url: https://github.com/alexrf45/th0th
repo_name: alexrf45/th0th
edit_uri: edit/dev/_docs/

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Prerequisites: prerequisites.md
  - Bootstrap the cluster: bootstrap.md
  - Infrastructure:
      - Networking: infra/networking.md
      - DNS: infra/dns.md
      - Storage: infra/storage.md
      - Secrets & PKI: infra/secrets-pki.md
      - Observability: infra/observability.md
  - Applications:
      - Authentik (SSO): apps/authentik.md
      - FreshRSS: apps/freshrss.md
      - Homer: apps/homer.md
  - Operations:
      - Cluster access: kubectl-wrapper.md
      - Best practices: guides/best-practices.md
      - Database rescue: guides/cnpg-rescue.md
