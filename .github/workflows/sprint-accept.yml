name: sprint-accept

on:
  pull_request:
    branches: [dev]
    paths:
      - '.claude/sprints/**'
      - '_lib/**'
      - '_clusters/**'
      - 'global/**'
      - 'terraform/**'

jobs:
  accept:
    if: startsWith(github.head_ref, 'sprint/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve task id from branch
        id: task
        run: |
          # Branch is sprint/<task-id> — strip the prefix.
          task_id="${GITHUB_HEAD_REF#sprint/}"
          echo "id=${task_id}" >> "$GITHUB_OUTPUT"
          echo "Task ID: ${task_id}"

      - name: Check accept.sh exists
        run: |
          script=".claude/sprints/${{ steps.task.outputs.id }}/accept.sh"
          if [[ ! -f "$script" ]]; then
            echo "::error::Missing acceptance test: $script"
            echo "Every sprint/* branch must ship a .claude/sprints/<task-id>/accept.sh."
            exit 1
          fi
          chmod +x "$script"

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint jq
          # kubectl for the built-in kustomize subcommand.
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          # yq for manifest invariant assertions.
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run acceptance test
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
        run: bash ".claude/sprints/${{ steps.task.outputs.id }}/accept.sh"
