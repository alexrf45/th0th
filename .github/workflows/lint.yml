name: lint

on:
  pull_request:
    branches: [dev]
    paths:
      - '_lib/**'
      - '_clusters/**'
      - 'global/**'
      - 'terraform/**'
      - '.github/workflows/lint.yml'
      - '.yamllint.yaml'
  push:
    branches: [dev]
    paths:
      - '_lib/**'
      - '_clusters/**'
      - 'global/**'
      - 'terraform/**'
      - '.github/workflows/lint.yml'
      - '.yamllint.yaml'

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool + yq
        env:
          # Closes O-12: catch Sprig-isms (mul/div/add/default/...) in alert
          # templates before the Prometheus Operator mutating webhook rejects
          # them at apply time. Bump as upstream releases; Renovate doesn't
          # parse GitHub Actions env values, so this pin is hand-maintained.
          PROMETHEUS_VERSION: "3.12.0"
        run: |
          set -euo pipefail
          curl -sLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf "prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          sudo install -m 0755 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          promtool --version
          yq --version

      - name: promtool check rules — extract .spec from PrometheusRule manifests
        run: |
          set -uo pipefail
          fail=0
          found=0
          # Multi-doc files are handled by `select(.kind == "PrometheusRule")`;
          # single-doc PrometheusRule files render the same .spec.
          while IFS= read -r f; do
            spec=$(yq 'select(.kind == "PrometheusRule") | .spec' "$f")
            [ -z "$spec" ] && continue
            found=$((found + 1))
            echo "::group::$f"
            if ! printf '%s\n' "$spec" | promtool check rules /dev/stdin; then
              echo "::error file=$f::promtool check rules failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(grep -rEl --include='*.yaml' --include='*.yml' '^kind: PrometheusRule' _lib/ global/ 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "::warning::No PrometheusRule manifests found under _lib/ or global/"
          else
            echo "Validated $found PrometheusRule file(s)"
          fi
          exit "$fail"
