---
extends: default

rules:
  # Kubernetes manifests commonly exceed 80 chars (annotations, images, URLs)
  line-length:
    max: 300
    allow-non-breakable-inline-mappings: true

  # Flux gotk-components and CRDs use inconsistent comment indentation
  comments:
    require-starting-space: true
    ignore-shebangs: true
    min-spaces-from-content: 1

  comments-indentation: disable

  # Standard indentation for k8s manifests
  indentation:
    spaces: 2
    indent-sequences: consistent

  # Allow multiple documents in a single file (common in k8s)
  document-start: disable

  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false

ignore: |
  .github/
  clusters/*/flux-system/gotk-components.yaml
  # _hack/ is one-off scratch / example YAML (see CLAUDE.md), not deployed.
  _hack/
  # Local MkDocs venv pollution — gitignored but lives on disk locally and
  # would trip yamllint on /lint. CI checkouts are clean; this is for parity.
  .venv-docs/
  # SOPS rules configs themselves — auto-emitted trailing-blank-line nits we
  # don't care to police on a file SOPS actively rewrites.
  **/.sops.yaml
  # SOPS-encrypted files emit 4-space indentation that trips the
  # indentation rule. They're never hand-edited; skip linting them.
  **/*.enc.yaml
  # SOPS-encrypted YAMLs that don't follow the *.enc.yaml naming convention.
  # Same 4-space SOPS-emitted indentation as above; enumerated explicitly.
  _lib/controllers/external-secrets/secrets.yaml
  _lib/controllers/renovate/secret.yaml
  _lib/networking/tailscale/secrets.yaml
  _lib/pki/certauth/homelab-internal-ca-keypair.yaml
  _lib/secrets/onepassword/openconnect-secret.yaml
  _lib/secrets/onepassword/secrets.yaml
  # Helm values block inside the local-path HelmRelease mixes sequence
  # indents because that's how the upstream chart's values reference works.
  # Format is enforced by Helm at render, not yamllint here.
  _lib/storage/local-path/helmrelease.yaml
  # Upstream CRDs (descriptions exceed 300 chars) and the upstream
  # snapshot-controller RBAC (sequence-indentation differs). Pinned to
  # v8.2.1, not hand-edited.
  global/crds/external-snapshotter/
  _lib/storage/snapshot-controller/rbac-snapshot-controller.yaml
  _lib/storage/snapshot-controller/setup-snapshot-controller.yaml
  # Community Grafana dashboard JSON shipped as ConfigMaps (O-9). Pinned to
  # specific grafana.com revisions per file header; embedded markdown
  # `content:` blocks in panels exceed the 300-char line cap. Not hand-edited.
  _lib/observability/kube-prometheus-stack/dashboards/dashboard-authentik.yaml
  _lib/observability/kube-prometheus-stack/dashboards/dashboard-cloudflared.yaml
